[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signalwatch"
version = "0.1.0"
description = "Local causal telemetry replay and trained anomaly-detector comparison"
requires-python = ">=3.11"
dependencies = ["fastapi==0.159.1", "uvicorn==0.54.0", "pydantic==2.14.1", "numpy==2.4.6", "scikit-learn==1.9.1", "joblib>=1.4,<2", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["signalwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
